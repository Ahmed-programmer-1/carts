<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قاموس الحياة — تعلّم الإنجليزية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Lexend+Deca:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161b27;
    --card: #1e2535;
    --border: #2a3347;
    --accent1: #f5a623;
    --accent2: #4ecdc4;
    --accent3: #ff6b6b;
    --accent4: #a78bfa;
    --text: #e8eaf0;
    --muted: #8892a4;
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #1a1f2e 0%, #0d0f14 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 24px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 1400px;
    margin: auto;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 1.6rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }

  .stats-bar {
    display: flex;
    gap: 20px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .stats-bar span { color: var(--accent1); font-weight: 700; }

  .search-wrap {
    width: 100%;
    max-width: 520px;
    position: relative;
  }

  #searchInput {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 10px 20px 10px 44px;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color .2s;
    direction: ltr;
  }
  #searchInput:focus { border-color: var(--accent2); }
  #searchInput::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 1rem;
  }

  #clearBtn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    display: none;
  }

  /* ── FILTER TABS ── */
  .filter-section {
    max-width: 1400px;
    margin: 20px auto 0;
    padding: 0 24px;
  }

  .filter-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .tab-btn {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 50px;
    padding: 6px 16px;
    color: var(--muted);
    font-family: 'Cairo', sans-serif;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .tab-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .tab-btn.active { background: var(--accent2); border-color: var(--accent2); color: #000; font-weight: 700; }

  /* ── MAIN GRID ── */
  .main {
    max-width: 1400px;
    margin: 28px auto;
    padding: 0 24px 60px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    margin-top: 36px;
  }

  .section-emoji { font-size: 1.6rem; }

  .section-title {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text);
  }

  .section-count {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 0.75rem;
    color: var(--muted);
    margin-right: auto;
  }

  /* ── TOPIC CARD ── */
  .topic-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
    transition: border-color .2s;
  }
  .topic-block:hover { border-color: var(--border); }

  .topic-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    cursor: pointer;
    background: var(--surface);
    border-bottom: 1px solid transparent;
    transition: background .2s;
    user-select: none;
  }
  .topic-header:hover { background: #1f2840; }
  .topic-header.open { border-bottom-color: var(--border); }

  .topic-num {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    flex-shrink: 0;
  }

  .topic-icon { font-size: 1.3rem; flex-shrink: 0; }

  .topic-name-ar {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
  }

  .topic-name-en {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 1px;
    font-family: 'Lexend Deca', sans-serif;
  }

  .topic-meta {
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .word-count-badge {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.73rem;
    color: var(--muted);
  }

  .chevron {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform .3s;
    flex-shrink: 0;
  }
  .topic-header.open .chevron { transform: rotate(180deg); }

  /* ── WORDS GRID ── */
  .words-container {
    display: none;
    padding: 20px;
  }
  .words-container.open { display: block; }

  .sub-group {
    margin-bottom: 20px;
  }

  .sub-group-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--accent2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
    font-family: 'Lexend Deca', sans-serif;
  }

  .words-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .word-card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: all .18s;
    position: relative;
  }
  .word-card:hover {
    border-color: var(--accent1);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(245,166,35,0.15);
  }
  .word-card.saved { border-color: var(--accent4); }
  .word-card.speaking { border-color: var(--accent2); background: rgba(78,205,196,0.08); }

  .word-card-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .word-text { flex: 1; }

  .speak-btn {
    background: rgba(245,166,35,0.15);
    border: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.75rem;
    flex-shrink: 0;
    transition: all .2s;
    color: var(--accent1);
  }
  .speak-btn:hover { background: rgba(245,166,35,0.35); transform: scale(1.15); }
  .speak-btn.active { background: var(--accent2); color: #000; }

  .word-en {
    font-family: 'Lexend Deca', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
    direction: ltr;
    text-align: left;
  }

  .word-ar {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 2px;
    text-align: right;
  }

  /* ── SEARCH RESULTS ── */
  #searchResults {
    display: none;
  }

  #searchResults.active {
    display: block;
  }

  .search-results-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .search-word-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    transition: all .18s;
  }
  .search-word-card:hover { border-color: var(--accent2); }

  .search-word-en {
    font-family: 'Lexend Deca', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    direction: ltr;
    text-align: left;
  }
  .search-word-ar { font-size: 0.77rem; color: var(--muted); margin-top: 2px; }
  .search-word-topic { font-size: 0.7rem; color: var(--accent2); margin-top: 3px; font-family: 'Lexend Deca', sans-serif; }

  .no-results {
    text-align: center;
    color: var(--muted);
    padding: 40px;
    font-size: 1rem;
  }

  /* ── SAVED WORDS PANEL ── */
  #savedPanel {
    position: fixed;
    bottom: 24px;
    left: 24px;
    background: var(--surface);
    border: 1.5px solid var(--accent4);
    border-radius: var(--radius);
    padding: 14px 18px;
    min-width: 200px;
    max-width: 320px;
    max-height: 320px;
    overflow-y: auto;
    display: none;
    z-index: 200;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #savedPanel.show { display: block; }

  .saved-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent4);
  }

  .saved-panel-header button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
  }

  .saved-list { font-family: 'Lexend Deca', sans-serif; font-size: 0.82rem; direction: ltr; }
  .saved-item { padding: 3px 0; color: var(--text); border-bottom: 1px solid var(--border); }
  .saved-item:last-child { border: none; }

  /* ── FLOATING BUTTONS ── */
  .float-buttons {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 200;
  }

  .float-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .float-btn:hover { transform: scale(1.1); }

  .btn-saved-toggle { background: var(--accent4); color: #fff; }
  .btn-top { background: var(--card); color: var(--muted); border: 1px solid var(--border); }
  .btn-expand-all { background: var(--accent2); color: #000; font-size: 0.7rem; font-weight: 700; font-family: 'Cairo', sans-serif; }
  .btn-play-all { background: var(--accent1); color: #000; font-size: 0.75rem; font-weight: 700; font-family: 'Cairo', sans-serif; }
  .btn-play-all.playing { background: var(--accent3); color: #fff; }

  /* ── CATEGORY DIVIDERS ── */
  .category-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 40px 0 20px;
  }
  .category-divider-line { flex: 1; height: 1px; background: var(--border); }
  .category-divider-label {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    white-space: nowrap;
  }
  .category-divider-emoji { font-size: 1.1rem; }

  /* ── HIGHLIGHT ── */
  mark { background: rgba(245,166,35,0.3); color: var(--accent1); border-radius: 3px; }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    z-index: 999;
  }
  #progressBar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    transition: width .1s;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 640px) {
    .header-inner { flex-direction: column; align-items: flex-start; }
    .search-wrap { max-width: 100%; }
    .stats-bar { font-size: 0.75rem; }
    .main { padding: 0 14px 60px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="progress-bar-wrap"><div id="progressBar"></div></div>

<header>
  <div class="header-inner">
    <div class="logo">📖 قاموس الحياة</div>
    <div class="stats-bar">
      <div>الموضوعات: <span>40</span></div>
      <div>الكلمات: <span id="totalCount">0</span></div>
      <div>المحفوظة: <span id="savedCount">0</span></div>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ابحث عن أي كلمة..." autocomplete="off">
      <button id="clearBtn">✕</button>
    </div>
  </div>
</header>

<div class="filter-section">
  <div class="filter-tabs" id="filterTabs">
    <button class="tab-btn active" data-cat="all">الكل</button>
    <button class="tab-btn" data-cat="basics">الأساسيات</button>
    <button class="tab-btn" data-cat="daily">الحياة اليومية</button>
    <button class="tab-btn" data-cat="real">الحياة الواقعية</button>
    <button class="tab-btn" data-cat="world">العالم</button>
    <button class="tab-btn" data-cat="tech">التكنولوجيا</button>
    <button class="tab-btn" data-cat="movement">الحركة</button>
    <button class="tab-btn" data-cat="language">اللغة</button>
    <button class="tab-btn" data-cat="concepts">المفاهيم</button>
    <button class="tab-btn" data-cat="tools">الأدوات</button>
  </div>
</div>

<div class="main">
  <div id="searchResults"></div>
  <div id="topicsContainer"></div>
</div>

<div class="float-buttons">
  <button class="float-btn btn-saved-toggle" id="savedToggle" title="كلماتي المحفوظة">⭐</button>
  <button class="float-btn btn-play-all" id="playAllBtn" title="تشغيل الكل">▶</button>
  <button class="float-btn btn-expand-all" id="expandAll" title="فتح / إغلاق الكل">فتح</button>
  <button class="float-btn btn-top" id="topBtn" title="للأعلى">↑</button>
</div>

<div id="savedPanel">
  <div class="saved-panel-header">
    <span>⭐ كلماتي</span>
    <button id="clearSaved">مسح الكل</button>
  </div>
  <div class="saved-list" id="savedList"></div>
</div>

let savedWords = JSON.parse(localStorage.getItem('savedWords') || '[]');
let allExpanded = false;
let currentCat = 'all';

// ═══════════════════════════════════════════════════════════
// BUILD UI
// ═══════════════════════════════════════════════════════════
const CAT_LABELS = {
  basics: "📌 الأساسيات", daily: "🧠 الحياة اليومية", real: "🏠 الحياة الواقعية",
  world: "🌍 العالم", tech: "💻 التكنولوجيا", movement: "🔄 الحركة",
  language: "🧠 اللغة", concepts: "🧩 المفاهيم", tools: "⚙️ أدوات اللغة"
};

function renderAll() {
  const container = document.getElementById('topicsContainer');
  container.innerHTML = '';

  const filtered = currentCat === 'all' ? TOPICS : TOPICS.filter(t => t.cat === currentCat);
  
  let lastCat = null;
  filtered.forEach(topic => {
    if (topic.cat !== lastCat) {
      if (currentCat === 'all') {
        const div = document.createElement('div');
        div.className = 'category-divider';
        div.innerHTML = `<div class="category-divider-line"></div><span class="category-divider-label">${CAT_LABELS[topic.cat]||topic.cat}</span><div class="category-divider-line"></div>`;
        container.appendChild(div);
      }
      lastCat = topic.cat;
    }
    container.appendChild(buildTopicBlock(topic));
  });

  updateTotalCount();
}

function buildTopicBlock(topic) {
  const totalWords = topic.groups.reduce((a,g)=>a+g.words.length,0);
  
  const block = document.createElement('div');
  block.className = 'topic-block';
  block.dataset.id = topic.id;
  block.dataset.cat = topic.cat;

  const header = document.createElement('div');
  header.className = 'topic-header';
  header.innerHTML = `
    <div class="topic-num">${topic.id}</div>
    <div class="topic-icon">${topic.emoji}</div>
    <div>
      <div class="topic-name-ar">${topic.nameAr}</div>
      <div class="topic-name-en">${topic.nameEn}</div>
    </div>
    <div class="topic-meta">
      <span class="word-count-badge">${totalWords} كلمة</span>
    </div>
    <span class="chevron">▼</span>
  `;

  const wordsDiv = document.createElement('div');
  wordsDiv.className = 'words-container';

  topic.groups.forEach(group => {
    const sg = document.createElement('div');
    sg.className = 'sub-group';
    sg.innerHTML = `<div class="sub-group-title">${group.title}</div>`;
    const grid = document.createElement('div');
    grid.className = 'words-grid';
    group.words.forEach(word => {
      const card = document.createElement('div');
      card.className = 'word-card' + (savedWords.includes(word.en) ? ' saved' : '');
      card.innerHTML = `
        <div class="word-card-inner">
          <div class="word-text">
            <div class="word-en">${word.en}</div>
            <div class="word-ar">${word.ar}</div>
          </div>
          <button class="speak-btn" title="استمع للكلمة">🔊</button>
        </div>`;
      // Click on speaker button → speak
      card.querySelector('.speak-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        speakWord(word.en, card.querySelector('.speak-btn'));
      });
      // Click on card → speak + toggle save
      card.addEventListener('click', () => {
        speakWord(word.en, card.querySelector('.speak-btn'));
        toggleSave(word.en, card);
      });
      grid.appendChild(card);
    });
    sg.appendChild(grid);
    wordsDiv.appendChild(sg);
  });

  header.addEventListener('click', () => {
    const open = header.classList.toggle('open');
    wordsDiv.classList.toggle('open', open);
  });

  block.appendChild(header);
  block.appendChild(wordsDiv);
  return block;
}

function updateTotalCount() {
  let total = 0;
  const filtered = currentCat === 'all' ? TOPICS : TOPICS.filter(t=>t.cat===currentCat);
  filtered.forEach(t => t.groups.forEach(g => total += g.words.length));
  document.getElementById('totalCount').textContent = TOPICS.reduce((a,t)=>a+t.groups.reduce((b,g)=>b+g.words.length,0),0);
  document.getElementById('savedCount').textContent = savedWords.length;
}

// ═══════════════════════════════════════════════════════════
// SAVE WORDS
// ═══════════════════════════════════════════════════════════
function toggleSave(word, card) {
  const idx = savedWords.indexOf(word);
  if (idx === -1) { savedWords.push(word); card.classList.add('saved'); }
  else { savedWords.splice(idx, 1); card.classList.remove('saved'); }
  localStorage.setItem('savedWords', JSON.stringify(savedWords));
  document.getElementById('savedCount').textContent = savedWords.length;
  renderSavedPanel();
}

function renderSavedPanel() {
  const list = document.getElementById('savedList');
  if (savedWords.length === 0) { list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem">لا توجد كلمات محفوظة</div>'; return; }
  list.innerHTML = savedWords.map(w => `<div class="saved-item">${w}</div>`).join('');
}

// SEARCH
// ═══════════════════════════════════════════════════════════
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.style.display = q ? 'block' : 'none';
  
  if (!q) {
    searchResults.classList.remove('active');
    searchResults.innerHTML = '';
    document.getElementById('topicsContainer').style.display = '';
    return;
  }

  document.getElementById('topicsContainer').style.display = 'none';
  searchResults.classList.add('active');

  const matches = [];
  TOPICS.forEach(topic => {
    topic.groups.forEach(group => {
      group.words.forEach(word => {
        if (word.en.toLowerCase().includes(q) || word.ar.includes(q)) {
          matches.push({...word, topic: topic.nameAr, topicEn: topic.nameEn, emoji: topic.emoji});
        }
      });
    });
  });

  if (matches.length === 0) {
    searchResults.innerHTML = `<div class="no-results">لا نتائج لـ "<strong>${searchInput.value}</strong>"</div>`;
    return;
  }

  const highlight = (text, q) => text.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
  
  searchResults.innerHTML = `<div style="color:var(--muted);font-size:0.82rem;margin-bottom:12px">${matches.length} نتيجة</div>
    <div class="search-results-grid">${matches.map(w=>`
    <div class="search-word-card">
      <div class="search-word-en">${highlight(w.en, q)}</div>
      <div class="search-word-ar">${highlight(w.ar, q)}</div>
      <div class="search-word-topic">${w.emoji} ${w.topic}</div>
    </div>`).join('')}</div>`;
});

clearBtn.addEventListener('click', () => {
  searchInput.value = ''; clearBtn.style.display = 'none';
  searchResults.classList.remove('active'); searchResults.innerHTML = '';
  document.getElementById('topicsContainer').style.display = '';
});

// ═══════════════════════════════════════════════════════════
// SPEECH SYNTHESIS
// ═══════════════════════════════════════════════════════════
let currentSpeakBtn = null;
let playAllActive = false;
let playAllTimeout = null;

function speakWord(word, btn) {
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  if (playAllTimeout) { clearTimeout(playAllTimeout); playAllTimeout = null; }

  // Reset previous active button
  if (currentSpeakBtn && currentSpeakBtn !== btn) {
    currentSpeakBtn.classList.remove('active');
    currentSpeakBtn.textContent = '🔊';
  }

  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1;

  // Pick best English voice if available
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en') && v.localService) ||
                  voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;

  if (btn) {
    currentSpeakBtn = btn;
    btn.classList.add('active');
    btn.textContent = '🔉';
    utter.onend = () => { btn.classList.remove('active'); btn.textContent = '🔊'; currentSpeakBtn = null; };
    utter.onerror = () => { btn.classList.remove('active'); btn.textContent = '🔊'; currentSpeakBtn = null; };
  }

  window.speechSynthesis.speak(utter);
}

// ── PLAY ALL (visible words in opened sections) ──────────────
function getAllVisibleWords() {
  const words = [];
  document.querySelectorAll('.words-container.open .word-card').forEach(card => {
    const en = card.querySelector('.word-en');
    const btn = card.querySelector('.speak-btn');
    if (en) words.push({ text: en.textContent.trim(), btn });
  });
  return words;
}

let playAllIndex = 0;
let playAllWords = [];

function stopPlayAll() {
  playAllActive = false;
  window.speechSynthesis.cancel();
  if (playAllTimeout) { clearTimeout(playAllTimeout); playAllTimeout = null; }
  if (currentSpeakBtn) { currentSpeakBtn.classList.remove('active'); currentSpeakBtn.textContent = '🔊'; currentSpeakBtn = null; }
  const btn = document.getElementById('playAllBtn');
  btn.textContent = '▶';
  btn.classList.remove('playing');
}

function playNext() {
  if (!playAllActive || playAllIndex >= playAllWords.length) {
    stopPlayAll();
    return;
  }
  const { text, btn } = playAllWords[playAllIndex];
  playAllIndex++;

  // Reset prev
  if (currentSpeakBtn && currentSpeakBtn !== btn) {
    currentSpeakBtn.classList.remove('active');
    currentSpeakBtn.textContent = '🔊';
  }

  // Scroll card into view
  if (btn) btn.closest('.word-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  utter.pitch = 1;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => v.lang.startsWith('en') && v.localService) || voices.find(v => v.lang.startsWith('en'));
  if (enVoice) utter.voice = enVoice;

  if (btn) {
    currentSpeakBtn = btn;
    btn.classList.add('active');
    btn.textContent = '🔉';
    utter.onend = () => {
      btn.classList.remove('active');
      btn.textContent = '🔊';
      currentSpeakBtn = null;
      if (playAllActive) playAllTimeout = setTimeout(playNext, 700);
    };
    utter.onerror = () => {
      btn.classList.remove('active');
      btn.textContent = '🔊';
      currentSpeakBtn = null;
      if (playAllActive) playAllTimeout = setTimeout(playNext, 300);
    };
  } else {
    utter.onend = () => { if (playAllActive) playAllTimeout = setTimeout(playNext, 700); };
  }

  window.speechSynthesis.speak(utter);
}

document.getElementById('playAllBtn').addEventListener('click', () => {
  if (playAllActive) { stopPlayAll(); return; }

  // If no sections are open, open all first
  const openSections = document.querySelectorAll('.words-container.open');
  if (openSections.length === 0) {
    document.querySelectorAll('.topic-header').forEach(h => h.classList.add('open'));
    document.querySelectorAll('.words-container').forEach(w => w.classList.add('open'));
    allExpanded = true;
    document.getElementById('expandAll').textContent = 'إغلاق';
  }

  playAllWords = getAllVisibleWords();
  if (playAllWords.length === 0) { alert('لا توجد كلمات مرئية! افتح قسماً أولاً.'); return; }

  playAllActive = true;
  playAllIndex = 0;
  const btn = document.getElementById('playAllBtn');
  btn.textContent = '⏹';
  btn.classList.add('playing');

  // Voices may not be loaded yet — small delay
  setTimeout(playNext, 300);
});

// Load voices (some browsers load them async)
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
renderAll();
updateTotalCount();
</script>
