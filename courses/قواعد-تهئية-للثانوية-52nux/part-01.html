<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر أحمد | English Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF6EC;
  --paper-line:#e8dfc8;
  --ink:#20293A;
  --ink-soft:#4b5568;
  --red:#B9412E;
  --red-soft:#e7c9c2;
  --sage:#4C7A6E;
  --sage-soft:#dbe9e4;
  --amber:#C7891E;
  --amber-soft:#f3e3c4;
  --hole:#cfc7ab;
  --card:#ffffff;
  --shadow: 0 2px 10px rgba(32,41,58,0.08);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Cairo','Inter',sans-serif;
  min-height:100vh;
}
::selection{background:var(--red-soft);}
a{color:inherit;}

/* Layout */
.app{
  display:grid;
  grid-template-columns: 300px 1fr;
  min-height:100vh;
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:sticky;top:0;z-index:50;max-height:none;}
}

/* Sidebar - spiral notebook feel */
.sidebar{
  background:#231d17;
  color:#f1e9d8;
  padding:28px 0 28px 0;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  border-left:6px solid var(--red);
}
.sidebar-holes{
  position:absolute;
  right:14px;
  top:0;
  bottom:0;
  width:10px;
}
.brand{
  padding:0 28px 20px 28px;
  border-bottom:1px dashed #55483a;
  margin-bottom:14px;
}
.brand .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.12em;
  color:#c9a36a;
  text-transform:uppercase;
}
.brand h1{
  font-family:'Zilla Slab',serif;
  font-size:26px;
  margin:6px 0 4px 0;
  color:#fff;
}
.brand p{
  margin:0;
  font-size:13px;
  color:#b9ac93;
  line-height:1.6;
}
.nav-group-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  letter-spacing:.1em;
  color:#8f8267;
  text-transform:uppercase;
  padding:14px 28px 6px 28px;
}
.nav-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:right;
  background:none;
  border:none;
  color:#e8ddc4;
  font-family:'Cairo',sans-serif;
  font-size:14.5px;
  padding:10px 28px;
  cursor:pointer;
  border-right:3px solid transparent;
  transition:.15s;
}
.nav-btn:hover{background:#33291f;}
.nav-btn.active{
  background:#3b2e21;
  border-right-color:var(--amber);
  color:#fff;
  font-weight:600;
}
.nav-btn .num{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:#8f8267;
  min-width:20px;
}
.nav-btn.active .num{color:var(--amber);}

/* Main content */
.main{
  padding:38px 48px 80px 48px;
  max-width:980px;
}
@media (max-width:700px){.main{padding:24px 18px 60px 18px;}}

.page-header{
  border-bottom:3px solid var(--red);
  padding-bottom:14px;
  margin-bottom:28px;
  position:relative;
}
.page-header .subject-label{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:var(--ink-soft);
  letter-spacing:.05em;
}
.page-header h2{
  font-family:'Zilla Slab',serif;
  font-size:34px;
  margin:4px 0 0 0;
  color:var(--ink);
}
.page-header .desc{
  color:var(--ink-soft);
  font-size:15px;
  margin-top:8px;
  max-width:640px;
  line-height:1.8;
}

.block{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:10px;
  padding:22px 24px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}
.block h3{
  font-family:'Zilla Slab',serif;
  font-size:20px;
  margin:0 0 10px 0;
  color:var(--ink);
  display:flex;
  align-items:center;
  gap:8px;
}
.block h3::before{
  content:"";
  display:inline-block;
  width:8px;height:8px;
  background:var(--red);
  border-radius:50%;
}
.block .ar-note{
  color:var(--ink-soft);
  font-size:14.5px;
  line-height:1.9;
  margin-bottom:12px;
}
.pattern{
  font-family:'IBM Plex Mono',monospace;
  direction:ltr;
  text-align:left;
  background:#1f2937;
  color:#eae3d2;
  padding:12px 16px;
  border-radius:8px;
  font-size:14px;
  margin:10px 0;
  overflow-x:auto;
  line-height:1.7;
}
.pattern .op{color:#c9a36a;}
.examples{margin-top:12px;}
.ex-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:10px 12px;
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:8px;
  margin-bottom:8px;
}
.ex-row .en{
  direction:ltr;
  text-align:left;
  flex:1;
  font-family:'Inter',sans-serif;
  font-size:15px;
  color:var(--ink);
}
.ex-row .ar{
  color:var(--ink-soft);
  font-size:13.5px;
  margin-top:3px;
}
.speak-btn{
  border:none;
  background:var(--sage-soft);
  color:var(--sage);
  width:34px;height:34px;
  border-radius:50%;
  cursor:pointer;
  font-size:15px;
  flex-shrink:0;
  transition:.15s;
}
.speak-btn:hover{background:var(--sage);color:#fff;}

/* Quiz */
.quiz-wrap{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:10px;
  padding:24px;
  box-shadow:var(--shadow);
}
.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  flex-wrap:wrap;
  gap:10px;
}
.quiz-header h3{
  font-family:'Zilla Slab',serif;
  font-size:22px;
  margin:0;
}
.quiz-progress{
  font-family:'IBM Plex Mono',monospace;
  font-size:13px;
  color:var(--ink-soft);
  background:var(--paper);
  padding:5px 12px;
  border-radius:20px;
  border:1px solid var(--paper-line);
}
.q-card{
  border:1px solid var(--paper-line);
  border-radius:8px;
  padding:16px 18px;
  margin-bottom:14px;
  background:var(--paper);
}
.q-card .q-meta{
  display:flex;
  justify-content:space-between;
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin-bottom:8px;
}
.q-card .diff{
  padding:2px 8px;
  border-radius:10px;
  font-size:10.5px;
}
.diff.easy{background:var(--sage-soft);color:var(--sage);}
.diff.med{background:var(--amber-soft);color:var(--amber);}
.diff.hard{background:var(--red-soft);color:var(--red);}
.q-text{
  direction:ltr;
  text-align:left;
  font-size:16px;
  font-family:'Inter',sans-serif;
  margin-bottom:12px;
  color:var(--ink);
}
.choices{display:flex;flex-direction:column;gap:8px;}
.choice{
  direction:ltr;
  text-align:left;
  border:1.5px solid var(--paper-line);
  background:#fff;
  border-radius:7px;
  padding:9px 14px;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  font-size:14.5px;
  transition:.12s;
}
.choice:hover{border-color:var(--sage);}
.choice.selected{border-color:var(--ink);background:#f2f2f2;}
.choice.correct{border-color:var(--sage);background:var(--sage-soft);}
.choice.wrong{border-color:var(--red);background:var(--red-soft);}
.q-explain{
  margin-top:10px;
  font-size:13.5px;
  color:var(--ink-soft);
  background:#fff;
  border-right:3px solid var(--sage);
  padding:8px 12px;
  border-radius:4px;
  display:none;
}
.q-explain.show{display:block;}
.quiz-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
.btn{
  border:none;
  padding:11px 22px;
  border-radius:8px;
  font-family:'Cairo',sans-serif;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  transition:.15s;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:#3a4459;}
.btn-secondary{background:#fff;border:1.5px solid var(--paper-line);color:var(--ink);}
.btn-secondary:hover{border-color:var(--ink);}
.score-banner{
  display:none;
  text-align:center;
  padding:20px;
  border-radius:10px;
  margin-bottom:18px;
  font-family:'Zilla Slab',serif;
  font-size:20px;
}
.score-banner.show{display:block;}
.score-great{background:var(--sage-soft);color:var(--sage);}
.score-ok{background:var(--amber-soft);color:var(--amber);}
.score-low{background:var(--red-soft);color:var(--red);}

/* Vocabulary page */
.vocab-toolbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.vocab-search{
  flex:1;
  min-width:200px;
  padding:11px 16px;
  border-radius:8px;
  border:1.5px solid var(--paper-line);
  font-family:'Cairo',sans-serif;
  font-size:14.5px;
  background:#fff;
}
.vocab-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
}
.vocab-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:10px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.vocab-card .word-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.vocab-card .word{
  direction:ltr;
  font-family:'Zilla Slab',serif;
  font-size:19px;
  font-weight:600;
  color:var(--ink);
}
.vocab-card .pos{
  font-family:'IBM Plex Mono',monospace;
  font-size:10.5px;
  color:var(--ink-soft);
  background:var(--paper);
  padding:2px 7px;
  border-radius:8px;
  margin-right:6px;
}
.vocab-card .ar{
  color:var(--red);
  font-size:14.5px;
  margin:6px 0 8px 0;
  font-weight:600;
}
.vocab-card .sentence{
  direction:ltr;
  text-align:left;
  font-size:13.5px;
  color:var(--ink-soft);
  background:var(--paper);
  padding:8px 10px;
  border-radius:6px;
  line-height:1.6;
}

/* Home page */
.home-hero{
  background:linear-gradient(135deg,#231d17,#3b2e21);
  color:#f1e9d8;
  border-radius:14px;
  padding:40px 36px;
  margin-bottom:26px;
  position:relative;
  overflow:hidden;
}
.home-hero::after{
  content:"";
  position:absolute;
  left:-40px;top:-40px;
  width:180px;height:180px;
  border:2px dashed rgba(255,255,255,0.08);
  border-radius:50%;
}
.home-hero .eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:12px;
  color:#c9a36a;
  letter-spacing:.1em;
}
.home-hero h2{
  font-family:'Zilla Slab',serif;
  font-size:32px;
  margin:8px 0;
}
.home-hero p{
  color:#cfc4a9;
  max-width:560px;
  line-height:1.9;
  font-size:15px;
}
.stat-row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  margin-top:20px;
}
.stat-pill{
  background:rgba(255,255,255,0.08);
  padding:8px 16px;
  border-radius:20px;
  font-family:'IBM Plex Mono',monospace;
  font-size:12.5px;
}
.lesson-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}
.lesson-card{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-radius:10px;
  padding:18px;
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:.15s;
}
.lesson-card:hover{transform:translateY(-2px);border-color:var(--sage);}
.lesson-card .lc-num{
  font-family:'IBM Plex Mono',monospace;
  color:var(--red);
  font-size:12px;
}
.lesson-card h4{
  font-family:'Zilla Slab',serif;
  font-size:17px;
  margin:6px 0;
}
.lesson-card p{
  color:var(--ink-soft);
  font-size:12.5px;
  margin:0;
  line-height:1.6;
}

.footer-note{
  text-align:center;
  color:var(--ink-soft);
  font-size:12.5px;
  margin-top:40px;
  padding-top:20px;
  border-top:1px dashed var(--paper-line);
}
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ============ DATA ============ */
const lessons = [
{
  id:"describe",
  title:"وصف الأشياء والأشخاص",
  short:"Provide, Include, Contain, Consist of",
  icon:"📋",
  sections:[
    {h:"Provide", ar:"يوفّر / يزوّد. له صيغتان حسب حرف الجر بعده.",
     pattern:"provide + sb + <span class='op'>with</span> + sth\nprovide + sth + <span class='op'>for</span> + sb",
     examples:[
       {en:"My family provide me with money.", ar:"عائلتي تزودني بالمال."},
       {en:"My parents provide food for many people.", ar:"والداي يوفران الطعام لأناس كثيرين."}
     ]},
    {h:"Include / Contain / Consist of", ar:"ثلاث كلمات متقاربة لكن بمعنى مختلف: <b>include</b> = يشمل (جزء من كل)، <b>contain</b> = يحتوي على (المحتوى الداخلي الفعلي)، <b>consist of</b> = يتكوّن من (أجزاء منفصلة يمكن فكّها وتركيبها).",
     pattern:"sth + include(s) / contain(s) / consist(s) of + sth",
     examples:[
       {en:"The price includes breakfast.", ar:"السعر يشمل الإفطار."},
       {en:"The bottle contains water.", ar:"الزجاجة تحتوي على ماء."},
       {en:"The team consists of eleven players.", ar:"الفريق يتكوّن من أحد عشر لاعبًا."}
     ]},
    {h:"Social / Sociable / Introvert / Extrovert", ar:"<b>social</b> = اجتماعي (متعلق بالمجتمع بشكل عام). <b>sociable</b> = شخص يحب مخالطة الناس بطبعه. <b>introvert</b> = شخص انطوائي يفضّل الهدوء والوحدة. <b>extrovert</b> = شخص منفتح يحب التجمعات.",
     pattern:"",
     examples:[
       {en:"He is a sociable person who loves parties.", ar:"هو شخص اجتماعي يحب الحفلات."},
       {en:"She is an introvert; she prefers reading alone.", ar:"هي انطوائية، تفضل القراءة بمفردها."}
     ]},
    {h:"Indoor/Indoors & Outdoor/Outdoors", ar:"<b>indoor / outdoor</b> صفة تسبق اسمًا (داخلي/خارجي). <b>indoors / outdoors</b> ظرف يصف مكان الفعل (في الداخل/في الخارج) ولا يأتي بعده اسم.",
     pattern:"adj: indoor/outdoor + noun\nadv: verb + indoors/outdoors",
     examples:[
       {en:"Football and basketball are outdoor games.", ar:"كرة القدم وكرة السلة رياضات خارجية."},
       {en:"We stayed indoors because of the rain.", ar:"بقينا في الداخل بسبب المطر."}
     ]},
    {h:"Although / Even though / Despite / In spite of", ar:"<b>although = even though</b> = بالرغم من، يليها جملة كاملة (فاعل + فعل). <b>despite = in spite of</b> = بالرغم من، يليها اسم أو Ving فقط (بدون جملة كاملة).",
     pattern:"although/even though + subject + verb\ndespite/in spite of + noun / Ving",
     examples:[
       {en:"Although it was raining, we went out.", ar:"بالرغم من أنها كانت تمطر، خرجنا."},
       {en:"Despite the rain, we went out.", ar:"بالرغم من المطر، خرجنا."}
     ]}
  ],
  quiz:[
    {q:"My parents ___ me with everything I need.", c:["provide","include","contain","consist"],a:0,ex:"provide + sb + with sth."},
    {q:"This box ___ old photos.", c:["includes","contains","provides","consists"],a:1,ex:"contain = يحتوي على المحتوى الداخلي الفعلي."},
    {q:"The team ___ eleven players.", c:["contains","includes","consists of","provides"],a:2,ex:"consist of = يتكون من أجزاء."},
    {q:"Football is an ___ game.", c:["indoors","outdoor","indoor","outdoors"],a:1,ex:"صفة قبل اسم = outdoor (بدون s)."},
    {q:"We stayed ___ all weekend because of the storm.", c:["indoor","outdoor","indoors","outdoors"],a:2,ex:"ظرف بعد فعل = indoors (بدون اسم بعده)."},
    {q:"She loves meeting new people; she's very ___.", c:["social","sociable","introvert","include"],a:1,ex:"sociable = يحب مخالطة الناس بطبعه."},
    {q:"___ the heavy traffic, we arrived on time.", c:["Although","Even though","Despite","While"],a:2,ex:"يليها اسم (traffic) بدون جملة، إذن despite."},
    {q:"___ he studied hard, he didn't pass.", c:["Despite","In spite of","Although","With"],a:2,ex:"يليها جملة كاملة (he studied)، إذن although."},
    {q:"The price ___ breakfast and dinner.", c:["contains","consists","includes","provides"],a:2,ex:"include = يشمل كجزء من الكل."},
    {q:"My uncle provides money ___ poor students.", c:["with","for","of","to"],a:1,ex:"provide sth for sb."},
    {q:"He prefers being alone; he's an ___.", c:["extrovert","sociable","introvert","social"],a:2,ex:"introvert = انطوائي يفضل الهدوء."},
    {q:"___ of the rain, the match continued.", c:["Although","Despite","In spite","In spite of"],a:3,ex:"in spite of + اسم = بالرغم من."}
  ]
},
{
  id:"causative-adj",
  title:"النتيجة والصفات",
  short:"Make + obj + adj/inf, -ed/-ing adjectives",
  icon:"⚙️",
  sections:[
    {h:"Make + obj + adjective", ar:"يُستخدم لوصف نتيجة فورية يشعر بها شخص أو شيء بسبب فعل ما.",
     pattern:"make + obj + adj",
     examples:[{en:"Bad news made him feel upset.", ar:"الخبر السيء جعله يشعر بالانزعاج."}]},
    {h:"Make + obj + infinitive (بدون to)", ar:"يُستخدم لإجبار شخص على فعل شيء.",
     pattern:"make + obj + inf",
     examples:[{en:"It's known that stress makes people react badly.", ar:"من المعروف أن التوتر يجعل الناس يتفاعلون بشكل سيء."}]},
    {h:"المبني للمجهول لنفس التركيب", ar:"عند تحويل الجملة للمجهول تضاف to قبل الفعل.",
     pattern:"obj + be + made + to + inf",
     examples:[{en:"People are made to react badly under stress.", ar:"الناس يُجعلون يتفاعلون بشكل سيء تحت الضغط."}]},
    {h:"صفات -ed و -ing", ar:"<b>-ed</b> تصف شعور الشخص نفسه. <b>-ing</b> تصف الشيء أو الموقف الذي يسبب هذا الشعور.",
     pattern:"person + is + adj-ed\nthing/situation + is + adj-ing",
     examples:[
       {en:"I'm interested in this subject.", ar:"أنا مهتم بهذا الموضوع."},
       {en:"This subject is interesting.", ar:"هذا الموضوع ممتع/مثير للاهتمام."}
     ]},
    {h:"Career, Profession, Work, Job", ar:"<b>career</b> = المسار المهني الكامل وتسلسل الوظائف عبر السنين. <b>profession</b> = مهنة تحتاج تدريبًا وتأهيلًا خاصًا (طبيب، محامٍ). <b>work</b> = العمل بشكل عام (فعل أو اسم غير معدود). <b>job</b> = وظيفة محددة يقوم بها شخص مقابل راتب.",
     pattern:"",
     examples:[
       {en:"She built a successful career in medicine.", ar:"بنت مسيرة مهنية ناجحة في الطب."},
       {en:"Teaching is a respected profession.", ar:"التدريس مهنة محترمة."},
       {en:"He found a new job last week.", ar:"وجد وظيفة جديدة الأسبوع الماضي."}
     ]}
  ],
  quiz:[
    {q:"Loud noise makes me ___.", c:["annoy","annoying","annoyed","to annoy"],a:2,ex:"شعور الشخص = annoyed."},
    {q:"This film is really ___.", c:["bored","boring","bore","to bore"],a:1,ex:"الشيء المسبب للشعور = boring."},

let currentId = "home";
let quizState = {};

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

}

function goTo(id){
  currentId = id;
  renderSidebar();
  if(id==='home') renderHome();
  else if(id==='words') renderWords();
  else renderLesson(id);
  window.scrollTo(0,0);
}

function renderHome(){
  const totalQ = lessons.reduce((s,l)=>s+l.quiz.length,0);
  let html = `
  <div class="home-hero">
    <div class="eyebrow">ENGLISH NOTEBOOK · A2 → B1+</div>
    <h2>كل قواعدك في مكان واحد</h2>
    <p>استخرجنا كل الدروس من دفترك الأصلي، صححنا الأخطاء، ونظمناها في ${lessons.length} درسًا مع أمثلة صوتية واختبارات متدرجة الصعوبة.</p>
    <div class="stat-row">
      <div class="stat-pill">${lessons.length} دروس</div>
      <div class="stat-pill">${totalQ} سؤال اختبار</div>
      <div class="stat-pill">${vocab.length} كلمة ومصطلح</div>
    </div>
  </div>
  <div class="page-header">
    <div class="subject-label">Subject: All Lessons</div>
    <h2>اختر درسًا للبدء</h2>
  </div>
  <div class="lesson-grid">`;
  lessons.forEach((l,i)=>{
    html += `<div class="lesson-card" onclick="goTo('${l.id}')">
      <div class="lc-num">${String(i+1).padStart(2,'0')} · ${l.icon}</div>
      <h4>${l.title}</h4>
      <p>${l.short}</p>
    </div>`;
  });
  html += `</div>
  <div class="footer-note">صُنع خصيصًا لأحمد من ملاحظاته المكتوبة بخط اليد ✍️</div>`;
  document.getElementById('main').innerHTML = html;
}

function renderLesson(id){
  const l = lessons.find(x=>x.id===id);
  if(!l) return renderHome();
  let html = `
  <div class="page-header">
    <div class="subject-label">Subject: ${l.short}</div>
    <h2>${l.icon} ${l.title}</h2>
  </div>`;
  l.sections.forEach(s=>{
    html += `<div class="block">
      <h3>${s.h}</h3>
      <div class="ar-note">${s.ar}</div>
      ${s.pattern ? `<div class="pattern">${s.pattern.replace(/\n/g,'<br>')}</div>` : ''}
      <div class="examples">`;
    s.examples.forEach((e,idx)=>{
      html += `<div class="ex-row">
        <button class="speak-btn" onclick="speak(${JSON.stringify(e.en)})" title="استمع">🔊</button>
        <div><div class="en">${e.en}</div><div class="ar">${e.ar}</div></div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += renderQuizHtml(l);
  document.getElementById('main').innerHTML = html;
  quizState[l.id] = quizState[l.id] || {answers:{}, checked:false};
}

function renderQuizHtml(l){
  const diffFor = (i,total)=> i < total*0.35 ? 'easy' : (i < total*0.7 ? 'med' : 'hard');
  const diffLabel = {easy:'سهل', med:'متوسط', hard:'صعب'};
  let html = `<div class="quiz-wrap" id="quiz-${l.id}">
    <div class="quiz-header">
      <h3>📝 اختبار الدرس</h3>
      <div class="quiz-progress" id="progress-${l.id}">0 / ${l.quiz.length}</div>
    </div>
    <div class="score-banner" id="score-${l.id}"></div>`;
  l.quiz.forEach((q,i)=>{
    const d = diffFor(i, l.quiz.length);
    html += `<div class="q-card" id="qc-${l.id}-${i}">
      <div class="q-meta"><span>سؤال ${i+1}</span><span class="diff ${d}">${diffLabel[d]}</span></div>
      <div class="q-text">${i+1}. ${q.q}</div>
      <div class="choices">`;
    q.c.forEach((c,ci)=>{
      html += `<button class="choice" onclick="selectChoice('${l.id}',${i},${ci})" id="ch-${l.id}-${i}-${ci}">${c}</button>`;
    });
    html += `</div><div class="q-explain" id="exp-${l.id}-${i}">${q.ex}</div></div>`;
  });
  html += `<div class="quiz-actions">
      <button class="btn btn-primary" onclick="checkQuiz('${l.id}')">تحقق من الإجابات</button>
      <button class="btn btn-secondary" onclick="resetQuiz('${l.id}')">إعادة المحاولة</button>
    </div>
  </div>`;
  return html;
}

function selectChoice(lid, qi, ci){
  const st = quizState[lid];
  if(st.checked) return;
  st.answers[qi] = ci;
  const l = lessons.find(x=>x.id===lid);
  l.quiz[qi].c.forEach((c,idx)=>{
    document.getElementById(`ch-${lid}-${qi}-${idx}`).classList.toggle('selected', idx===ci);
  });
  updateProgress(lid);
}

function updateProgress(lid){
  const l = lessons.find(x=>x.id===lid);
  const st = quizState[lid];
  const answered = Object.keys(st.answers).length;
  document.getElementById(`progress-${lid}`).textContent = `${answered} / ${l.quiz.length}`;
}

function checkQuiz(lid){
  const l = lessons.find(x=>x.id===lid);
  const st = quizState[lid];
  st.checked = true;
  let correct = 0;
  l.quiz.forEach((q,i)=>{
    const chosen = st.answers[i];
    q.c.forEach((c,ci)=>{
      const el = document.getElementById(`ch-${lid}-${i}-${ci}`);
      el.style.pointerEvents = 'none';
      if(ci===q.a) el.classList.add('correct');
      else if(ci===chosen && chosen!==q.a) el.classList.add('wrong');
    });
    if(chosen===q.a) correct++;
    document.getElementById(`exp-${lid}-${i}`).classList.add('show');
  });
  const pct = Math.round((correct/l.quiz.length)*100);
  const banner = document.getElementById(`score-${lid}`);
  banner.classList.add('show');
  let cls = 'score-low', msg = `تحتاج مراجعة أكتر — ${correct}/${l.quiz.length} (${pct}%)`;
  if(pct>=85){cls='score-great'; msg = `ممتاز جدًا! 🎉 ${correct}/${l.quiz.length} (${pct}%)`;}
  else if(pct>=60){cls='score-ok'; msg = `جيد، قريب من الاحتراف — ${correct}/${l.quiz.length} (${pct}%)`;}
  banner.className = `score-banner show ${cls}`;
  banner.textContent = msg;
  banner.scrollIntoView({behavior:'smooth', block:'center'});
}

function resetQuiz(lid){
  quizState[lid] = {answers:{}, checked:false};
  renderLesson(lid);
}

function renderWords(){
  let html = `
  <div class="page-header">
    <div class="subject-label">Subject: Vocabulary</div>
    <h2>📚 الكلمات والمصطلحات</h2>
    <div class="desc">كل كلمة ظهرت في الدروس أو الدفتر، مع جملة توضيحية وزر استماع للكلمة والجملة.</div>
  </div>
  <div class="vocab-toolbar">
    <input class="vocab-search" id="vsearch" placeholder="ابحث عن كلمة... (search)" oninput="filterVocab()">
  </div>
  <div class="vocab-grid" id="vgrid"></div>`;
  document.getElementById('main').innerHTML = html;
  drawVocab(vocab);
}

function drawVocab(list){
  const grid = document.getElementById('vgrid');
  grid.innerHTML = list.map(v=>`
    <div class="vocab-card">
      <div class="word-row">
        <span class="word">${v.w}</span>
        <button class="speak-btn" onclick="speak(${JSON.stringify(v.w.split('(')[0].split('/')[0].trim())})" title="استمع للكلمة">🔊</button>
      </div>
      <span class="pos">${v.pos}</span>
      <div class="ar">${v.ar}</div>
      <div class="sentence">
        ${v.ex}
        <div style="margin-top:6px;"><button class="speak-btn" style="width:auto;padding:4px 10px;border-radius:14px;font-size:11px;" onclick="speak(${JSON.stringify(v.ex)})">🔊 استمع للجملة</button></div>
      </div>
    </div>
  `).join('');
}

function filterVocab(){
  const q = document.getElementById('vsearch').value.toLowerCase();
  const filtered = vocab.filter(v=> v.w.toLowerCase().includes(q) || v.ar.includes(q) || v.ex.toLowerCase().includes(q));
  drawVocab(filtered);
}

/* init */
renderSidebar();
renderHome();
</script>
</body>
</html>
