<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 تعلم الإنجليزية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --card: #13131f;
    --border: #1e1e32;
    --accent: #f97316;
    --accent2: #fb923c;
    --text: #f1f0ec;
    --muted: #9090a8;
    --green: #22c55e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .topbar {
    background: linear-gradient(135deg, #1a0a00 0%, #0f0f1e 100%);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .topbar h1 { font-size: 20px; font-weight: 800; color: var(--accent); }
  .topbar p { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Search */
  .search-wrap { padding: 12px 16px 4px; }
  .search-input {
    width: 100%;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  /* Categories grid */
  .cats-wrap {
    padding: 12px 12px 8px;
    overflow-x: auto;
    display: flex;
    gap: 8px;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .cats-wrap::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0;
    background: var(--card);
    border: 1.5px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    scroll-snap-align: start;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    box-shadow: 0 0 14px rgba(249,115,22,0.4);
  }
  .cat-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  /* Group header */
  .grp-header {
    padding: 14px 20px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .grp-emoji { font-size: 26px; }
  .grp-name { font-size: 19px; font-weight: 800; }
  .grp-sub { font-size: 12px; color: var(--muted); }

  /* Progress */
  .prog-wrap { padding: 0 20px 12px; }
  .prog-bar { background: var(--border); border-radius: 8px; height: 5px; overflow: hidden; }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 8px;
    transition: width 0.5s;
  }
  .prog-label { font-size: 11px; color: var(--muted); margin-top: 4px; direction: ltr; text-align: left; }

  /* Cards */
  .cards { padding: 0 12px 110px; display: flex; flex-direction: column; gap: 9px; }
  .word-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }
  .word-card:hover { border-color: rgba(249,115,22,0.4); transform: translateY(-1px); box-shadow: 0 5px 18px rgba(0,0,0,0.3); }
  .word-card.playing { border-color: var(--accent); box-shadow: 0 0 18px rgba(249,115,22,0.3); }
  .word-card.learned { border-color: rgba(34,197,94,0.35); }
  .word-card.hidden { display: none; }

  .snd-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(249,115,22,0.1);
    border: 1.5px solid rgba(249,115,22,0.3);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 17px;
    transition: all 0.2s;
  }
  .word-card.playing .snd-btn { background: var(--accent); border-color: var(--accent); animation: pulse 0.8s infinite; }
  .word-card.learned .snd-btn { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.4); }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

  .wc { flex: 1; }
  .w-en { font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 700; direction: ltr; text-align: left; }
  .w-ar { font-size: 14px; font-weight: 700; color: var(--muted); text-align: right; margin-top: 3px; }
  .w-check { font-size: 17px; opacity: 0; transition: opacity 0.3s; }
  .word-card.learned .w-check { opacity: 1; }

  /* Bottom bar */
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 18px 16px 20px;
    display: flex; gap: 8px;
  }
  .btn-play {
    flex: 1; background: var(--accent); color: white; border: none;
    border-radius: 13px; padding: 13px;
    font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 800;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 18px rgba(249,115,22,0.4);
  }
  .btn-play:hover { transform: scale(1.02); }
  .btn-reset {
    background: var(--card); border: 1.5px solid var(--border);
    color: var(--muted); border-radius: 13px; padding: 13px 16px;
    font-size: 19px; cursor: pointer; transition: all 0.2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* Toast */
  .toast {
    position: fixed; top: 76px; left: 50%;
    transform: translateX(-50%) translateY(-15px);
    background: var(--green); color: white;
    padding: 9px 18px; border-radius: 18px;
    font-size: 13px; font-weight: 700;
    opacity: 0; transition: all 0.3s;
    pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Search results */
  .search-results { padding: 0 12px 110px; display: flex; flex-direction: column; gap: 9px; }
  .no-results { text-align: center; padding: 40px; color: var(--muted); font-size: 15px; }

  #search-view { display: none; }
  #main-view { display: block; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🔥 تعلم الإنجليزية</h1>
  <p>اضغط على أي كلمة لتسمع نطقها</p>
</div>

<div class="search-wrap">
  <input class="search-input" id="searchBox" placeholder="🔍 ابحث بالإنجليزي أو العربي..." oninput="handleSearch(this.value)" />
</div>

<div id="search-view">
  <div class="search-results" id="searchResults"></div>
</div>

<div id="main-view">
  <div class="cats-wrap" id="tabs"></div>
  <div id="groupContent"></div>

<div class="bottom-bar" id="bottomBar">

function init() {
  const tabs = document.getElementById('tabs');
  groups.forEach((g, i) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
    btn.id = 'tab-' + i;
    btn.textContent = g.emoji + ' ' + g.name;
    btn.onclick = () => switchGroup(i);
    tabs.appendChild(btn);
  });
  renderGroup(0);
}

function switchGroup(i) {
  stopAll();
  document.querySelectorAll('.cat-btn').forEach((b, j) => b.classList.toggle('active', j === i));
  currentGroup = i;
  renderGroup(i);
  document.getElementById('tabs').children[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function renderGroup(i) {
  const g = groups[i];
  const learned_count = g.words.filter((_, wi) => learned[g.id + '-' + wi]).length;
  const pct = Math.round(learned_count / g.words.length * 100);

  let html = `
    <div class="grp-header">
      <span class="grp-emoji">${g.emoji}</span>
      <div><div class="grp-name">${g.name}</div><div class="grp-sub">${g.words.length} كلمة</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-label">${learned_count} / ${g.words.length} learned</div>
    </div>
    <div class="cards" id="cards">`;

  g.words.forEach((w, wi) => {
    const key = g.id + '-' + wi;
    const isL = learned[key] ? ' learned' : '';
    html += `<div class="word-card${isL}" id="wc-${wi}" onclick="speak('${w.en.replace(/'/g,"\\'")}',${i},${wi})">
      <div class="snd-btn">🔊</div>
      <div class="wc">
        <div class="w-en">${w.en}</div>
        <div class="w-ar">${w.ar}</div>
      </div>
      <div class="w-check">✅</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('groupContent').innerHTML = html;
}

function speak(text, gi, wi) {
  stopAll();
  if (!window.speechSynthesis) { showToast("⚠️ المتصفح لا يدعم الصوت"); return; }
  const key = groups[gi].id + '-' + wi;
  const card = document.getElementById('wc-' + wi);
  if (card) card.classList.add('playing');

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US'; utt.rate = 0.85;
  utt.onend = () => {
    if (card) { card.classList.remove('playing'); card.classList.add('learned'); }
    learned[key] = true;
    localStorage.setItem('eng_learned', JSON.stringify(learned));
    updateProg(gi);
  };
  utt.onerror = () => { if (card) card.classList.remove('playing'); };
  window.speechSynthesis.speak(utt);
}

function speakSearch(text, key, cardId) {
  stopAll();
  if (!window.speechSynthesis) return;
  const card = document.getElementById(cardId);
  if (card) card.classList.add('playing');
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US'; utt.rate = 0.85;
  utt.onend = () => {
    if (card) { card.classList.remove('playing'); card.classList.add('learned'); }
    learned[key] = true;
    localStorage.setItem('eng_learned', JSON.stringify(learned));
  };
  utt.onerror = () => { if (card) card.classList.remove('playing'); };
  window.speechSynthesis.speak(utt);
}

function stopAll() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.querySelectorAll('.word-card.playing').forEach(c => c.classList.remove('playing'));
  isPlayingAll = false;
  document.getElementById('btnPlay').textContent = '▶ تشغيل المجموعة كلها';
}

function playAll() {
  if (searchMode) return;
  if (isPlayingAll) { stopAll(); return; }
  stopAll();
  isPlayingAll = true;
  document.getElementById('btnPlay').textContent = '⏹ إيقاف';
  const g = groups[currentGroup];
  let i = 0;
  function next() {
    if (!isPlayingAll || i >= g.words.length) {
      isPlayingAll = false;
      document.getElementById('btnPlay').textContent = '▶ تشغيل المجموعة كلها';
      if (i >= g.words.length) showToast("🎉 انتهيت من المجموعة!");
      return;
    }
    const w = g.words[i];
    const key = g.id + '-' + i;
    const card = document.getElementById('wc-' + i);
    if (card) { card.classList.add('playing'); card.scrollIntoView({behavior:'smooth',block:'center'}); }
    const utt = new SpeechSynthesisUtterance(w.en);
    utt.lang = 'en-US'; utt.rate = 0.85;
    utt.onend = () => {
      if (card) { card.classList.remove('playing'); card.classList.add('learned'); }
      learned[key] = true;
      localStorage.setItem('eng_learned', JSON.stringify(learned));
      updateProg(currentGroup);
      i++;
      setTimeout(next, 550);
    };
    utt.onerror = () => { if (card) card.classList.remove('playing'); i++; next(); };
    window.speechSynthesis.speak(utt);
  }
  next();
}

function updateProg(gi) {
  const g = groups[gi];
  const cnt = g.words.filter((_, wi) => learned[g.id + '-' + wi]).length;
  const pct = Math.round(cnt / g.words.length * 100);
  const fill = document.querySelector('.prog-fill');
  const label = document.querySelector('.prog-label');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = cnt + ' / ' + g.words.length + ' learned';
}

function resetLearned() {
  if (searchMode) return;
  if (!confirm('هل تريد إعادة تعيين التقدم للمجموعة الحالية؟')) return;
  const g = groups[currentGroup];
  g.words.forEach((_, wi) => {
    delete learned[g.id + '-' + wi];
    const card = document.getElementById('wc-' + wi);
    if (card) card.classList.remove('learned');
  });
  localStorage.setItem('eng_learned', JSON.stringify(learned));
  updateProg(currentGroup);
  showToast("↺ تم إعادة التعيين");
}

function handleSearch(val) {
  const q = val.trim().toLowerCase();
  if (!q) {
    searchMode = false;
    document.getElementById('search-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'block';
    document.getElementById('bottomBar').style.display = 'flex';
    return;
  }
  searchMode = true;
  stopAll();
  document.getElementById('search-view').style.display = 'block';
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('bottomBar').style.display = 'none';

  const results = [];
  groups.forEach((g) => {
    g.words.forEach((w, wi) => {
      if (w.en.toLowerCase().includes(q) || w.ar.includes(val.trim())) {
        results.push({ w, key: g.id + '-' + wi, gname: g.name, gemoji: g.emoji });
      }
    });
  });

  const container = document.getElementById('searchResults');
  if (results.length === 0) {
    container.innerHTML = '<div class="no-results">لا توجد نتائج 🔍</div>';
    return;
  }

  container.innerHTML = results.map((r, i) => {
    const isL = learned[r.key] ? ' learned' : '';
    const cid = 'src-' + i;
    return `<div class="word-card${isL}" id="${cid}" onclick="speakSearch('${r.w.en.replace(/'/g,"\\'")}','${r.key}','${cid}')">
      <div class="snd-btn">🔊</div>
      <div class="wc">
        <div class="w-en">${r.w.en}</div>
        <div class="w-ar">${r.w.ar}</div>
      </div>
      <div class="w-check">✅</div>
    </div>`;
  }).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

init();
</script>
</body>
</html>
