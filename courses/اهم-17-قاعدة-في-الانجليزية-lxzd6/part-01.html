<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أهم 17 قاعدة بالإنجليزي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF6B2B;
  --teal: #1DB8A0;
  --dark: #0F1923;
  --darker: #080E15;
  --card: #162030;
  --card2: #1C2A3A;
  --text: #E8F0F7;
  --muted: #7A9BB5;
  --yellow: #FFD166;
  --pink: #FF4F8B;
  --sw: 270px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:var(--darker); color:var(--text); overflow-x:hidden; }

/* SIDEBAR */
#sidebar {
  position:fixed; top:0; right:0;
  width:var(--sw); height:100vh;
  background:var(--dark);
  border-left:2px solid rgba(29,184,160,0.25);
  z-index:100; display:flex; flex-direction:column;
  transform:translateX(0);
  transition:transform .35s ease;
}
#sidebar.closed { transform:translateX(100%); }

.sb-head {
  padding:20px 16px 14px;
  background:linear-gradient(135deg,#1a8f7e,#0d5f54);
  text-align:center; flex-shrink:0;
}
.sb-head h2 { font-size:17px; font-weight:900; color:#fff; }
.sb-head small { font-size:11px; color:rgba(255,255,255,.65); display:block; margin-top:3px; }

.sb-list { overflow-y:auto; flex:1; padding:8px 0; }
.sb-list::-webkit-scrollbar { width:3px; }
.sb-list::-webkit-scrollbar-thumb { background:var(--teal); border-radius:2px; }

.sb-item {
  padding:11px 16px; cursor:pointer;
  display:flex; align-items:center; gap:11px;
  border-right:3px solid transparent;
  transition:background .15s, border-color .15s;
}
.sb-item:hover { background:rgba(29,184,160,.09); border-right-color:var(--teal); }
.sb-item.active { background:rgba(29,184,160,.14); border-right-color:var(--orange); }

.sb-num {
  width:26px; height:26px; border-radius:50%;
  background:rgba(29,184,160,.15);
  border:1.5px solid rgba(29,184,160,.5);
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700; color:var(--teal); flex-shrink:0;
}
.sb-item.active .sb-num { background:var(--orange); border-color:var(--orange); color:#fff; }
.sb-name { font-size:13px; font-weight:600; line-height:1.35; }
.sb-en { font-size:11px; color:var(--muted); display:block; margin-top:1px; }

/* TOGGLE BUTTON */
#tog {
  position:fixed; top:16px; right:16px; z-index:200;
  width:44px; height:44px; border-radius:50%;
  background:var(--teal); border:none; cursor:pointer;
  font-size:20px; color:#fff;
  box-shadow:0 3px 14px rgba(29,184,160,.45);
  transition:background .2s, right .35s ease, transform .2s;
  display:flex; align-items:center; justify-content:center;
}
#tog:hover { background:var(--orange); transform:scale(1.08); }
#tog.shifted { right:calc(var(--sw) + 12px); }

/* MAIN */
#main {
  margin-right:var(--sw);
  min-height:100vh; padding-bottom:60px;
  transition:margin-right .35s ease;
}
#main.full { margin-right:0; }

/* HERO */
.hero {
  padding:56px 44px 36px;
  background:linear-gradient(135deg,var(--dark) 0%,#0a1520 100%);
  border-bottom:1px solid rgba(255,255,255,.05);
  position:relative; overflow:hidden;
}
.hero::before {
  content:'';
  position:absolute; top:-80px; left:-60px;
  width:400px; height:400px; border-radius:50%;
  background:radial-gradient(circle,rgba(29,184,160,.07) 0%,transparent 70%);
  pointer-events:none;
}
.hero-badge {
  display:inline-block;
  background:rgba(29,184,160,.12);
  border:1px solid rgba(29,184,160,.35);
  color:var(--teal); font-size:11px; font-weight:700;
  padding:4px 13px; border-radius:100px;
  margin-bottom:14px; letter-spacing:1px;
}
.hero h1 { font-size:38px; font-weight:900; line-height:1.2; margin-bottom:10px; }
.hero h1 span { color:var(--orange); }
.hero p { color:var(--muted); font-size:15px; line-height:1.7; max-width:460px; }

/* CONTENT */
#content { padding:36px 44px; max-width:880px; }

/* WELCOME */
.welcome { text-align:center; padding:70px 20px; }
.welcome .ico { font-size:72px; display:block; margin-bottom:20px; animation:bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
.welcome h2 { font-size:26px; font-weight:900; margin-bottom:10px; }
.welcome p { color:var(--muted); font-size:15px; line-height:1.7; }
.welcome .hint {
  margin-top:28px; color:var(--teal); font-size:14px; font-weight:600;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* LESSON ANIMATION */
.lesson { animation:slideIn .4s ease forwards; }
@keyframes slideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

/* LESSON HEADER */
.l-head { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
.l-num {
  width:50px; height:50px; border-radius:13px; flex-shrink:0;
  background:linear-gradient(135deg,var(--orange),#ff9055);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:900; color:#fff;
  box-shadow:0 4px 14px rgba(255,107,43,.35);
}
.l-head h2 { font-size:26px; font-weight:900; }
.l-head .en { font-size:13px; color:var(--teal); font-weight:600; display:block; margin-top:2px; }

/* BLOCK */
.blk {
  background:var(--card); border-radius:14px;
  padding:22px 26px; margin-bottom:18px;
  border:1px solid rgba(255,255,255,.055);
  position:relative; overflow:hidden;
}
.blk::before {
  content:''; position:absolute;
  top:0; right:0; width:4px; height:100%;
  background:var(--teal); border-radius:0 4px 4px 0;
}
.blk.or::before { background:var(--orange); }
.blk.yl::before { background:var(--yellow); }
.blk.pk::before { background:var(--pink); }

.blk-lbl {
  font-size:10px; font-weight:700; letter-spacing:2px;
  text-transform:uppercase; margin-bottom:8px;
  display:flex; align-items:center; gap:7px;
}
.blk-lbl.tl { color:var(--teal); }
.blk-lbl.or { color:var(--orange); }
.blk-lbl.yl { color:var(--yellow); }
.blk-lbl.pk { color:var(--pink); }

.blk h3 { font-size:18px; font-weight:800; margin-bottom:8px; }
.blk p { font-size:14px; line-height:1.8; color:#c0d5e8; }

/* INFO BOX */
.info {
  background:rgba(29,184,160,.07);
  border:1px solid rgba(29,184,160,.22);
  border-radius:10px; padding:13px 16px;
  margin:12px 0; display:flex; gap:10px;
}
.info .ic { font-size:18px; flex-shrink:0; margin-top:1px; }
.info p { font-size:13px; color:#9dd4c8; line-height:1.7; margin:0; }

/* FORMULA */
.formula {
  background:var(--card2); border-radius:10px;
  padding:13px 16px; margin:12px 0;
  display:flex; align-items:center; flex-wrap:wrap; gap:8px;
  border:1px dashed rgba(255,209,102,.3);
}
.fpart {
  background:rgba(255,209,102,.1);
  border:1px solid rgba(255,209,102,.35);
  padding:4px 11px; border-radius:7px;
  font-size:13px; font-weight:700; color:var(--yellow);
}
.fop { color:var(--muted); font-size:15px; }

/* EXAMPLES GRID */
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px; margin-top:12px; }

.ecard {
  background:var(--card2); border-radius:11px;
  padding:13px 15px; border:1px solid rgba(255,255,255,.055);
  cursor:pointer; transition:all .2s; position:relative;
}
.ecard:hover {
  background:rgba(29,184,160,.11);
  border-color:rgba(29,184,160,.38);
  transform:translateY(-2px);
  box-shadow:0 5px 18px rgba(29,184,160,.12);
}
.ecard:active { transform:scale(.97); }
.ecard .en {
  font-size:14px; font-weight:700; color:var(--teal);
  margin-bottom:5px; direction:ltr; text-align:left; line-height:1.5;
}
.ecard .en .h { color:var(--orange); background:rgba(255,107,43,.1); padding:0 3px; border-radius:3px; }
.ecard .ar { font-size:12px; color:var(--muted); }
.ecard .snd { font-size:11px; color:rgba(29,184,160,.45); margin-top:5px; }

/* TABLE */
.gtbl {
  width:100%; border-collapse:separate; border-spacing:0;
  margin:12px 0; border-radius:11px; overflow:hidden;
  border:1px solid rgba(255,255,255,.065);
}
.gtbl th {
  background:linear-gradient(135deg,var(--teal),#0e8a76);
  color:#fff; font-size:12px; font-weight:700;
  padding:11px 14px; text-align:right;
}
.gtbl td {
  padding:10px 14px; font-size:13px;
  border-bottom:1px solid rgba(255,255,255,.045);
  background:var(--card2); direction:ltr; text-align:left;
}
.gtbl tr:last-child td { border-bottom:none; }
.gtbl tr:hover td { background:rgba(29,184,160,.07); }
.gtbl .ar { direction:rtl; text-align:right; color:var(--muted); }
.gtbl .tl { color:var(--teal); font-weight:700; }

/* RULE BOX */
.rbox {
  background:var(--card2); border-radius:10px;
  padding:14px 17px; margin:10px 0;
  border:1px solid rgba(255,255,255,.06);
}
.rbox .rt {
  font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; margin-bottom:7px;
  display:flex; align-items:center; gap:6px;
}
.rbox .rt.neg { color:var(--pink); }
.rbox .rt.pos { color:var(--teal); }
.rbox .rt.que { color:var(--yellow); }
.rbox code {
  display:block; font-family:monospace; font-size:13px;
  color:var(--text); padding:7px 11px;
  background:rgba(0,0,0,.35); border-radius:7px;
  margin:5px 0; direction:ltr; text-align:left;
}

/* TAGS */
.tags { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0; }
.tag {
  padding:4px 12px; border-radius:100px;
  font-size:12px; font-weight:700; border:1.5px solid;
}
.tag.tl { color:var(--teal); border-color:rgba(29,184,160,.38); background:rgba(29,184,160,.07); }
.tag.or { color:var(--orange); border-color:rgba(255,107,43,.38); background:rgba(255,107,43,.07); }
.tag.yl { color:var(--yellow); border-color:rgba(255,209,102,.38); background:rgba(255,209,102,.07); }

/* TOAST */
#toast {
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--teal); color:#fff;
  padding:9px 20px; border-radius:100px;
  font-size:13px; font-weight:700; z-index:9999;
  transition:transform .35s cubic-bezier(.23,1,.32,1);
  pointer-events:none; white-space:nowrap;
}
#toast.show { transform:translateX(-50%) translateY(0); }

/* SPEAKING */
.speaking { animation:spk .4s ease; }
@keyframes spk { 0%{transform:scale(1)} 50%{transform:scale(1.04);box-shadow:0 0 18px rgba(29,184,160,.4)} 100%{transform:scale(1)} }

@media(max-width:700px){
  :root{--sw:255px;}
  .hero{padding:70px 18px 28px;}
  .hero h1{font-size:26px;}
  #content{padding:20px 16px;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<button id="tog">☰</button>

<div id="sidebar">
  <div class="sb-head">
    <h2>📚 دليلك للإنجليزي</h2>
    <small>أهم 17 قاعدة</small>
  </div>
  <div class="sb-list" id="sblist"></div>
</div>

<div id="main">
  <div class="hero">
    <div class="hero-badge">✦ دليلك للإنجليزي</div>
    <h1>أهم <span>17</span> قاعدة<br>بالإنجليزي</h1>
    <p>اختار الدرس من القائمة وتعلم بأسلوب واضح مع أمثلة تقدر تسمعها 🎧</p>
  </div>
  <div id="content">
    <div class="welcome" id="wel">
      <span class="ico">🎯</span>
      <h2>ابدأ رحلتك مع الإنجليزي</h2>
      <p>اضغط على زر القائمة في أعلى اليمين<br>واختار الدرس اللي تبيه</p>
      <div class="hint">☝️ اضغط الزر في أعلى اليمين للبدء</div>
    </div>
    <div id="lc" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
var LESSONS = [
  {id:1, ar:'أجزاء الكلام', en:'Parts of Speech'},
  {id:2, ar:'ضمائر الفاعل', en:'Subject Pronouns'},
  {id:3, ar:'حروف الجر', en:'Prepositions'},
  {id:4, ar:'المفرد والجمع', en:'Singular & Plural'},
  {id:5, ar:'أدوات التنكير والتعريف', en:'Articles: a / an / the'},
  {id:6, ar:'الصفات', en:'Adjectives'},
  {id:7, ar:'الأحوال', en:'Adverbs'},
  {id:8, ar:'قاعدة تكوين الجملة', en:'Sentence Structure'},
  {id:9, ar:'المضارع البسيط', en:'Simple Present'},
  {id:10, ar:'الماضي البسيط', en:'Simple Past'},
  {id:11, ar:'المستقبل البسيط', en:'Simple Future (will)'},
  {id:12, ar:'المضارع المستمر', en:'Present Continuous'},
  {id:13, ar:'الماضي المستمر', en:'Past Continuous'},
  {id:14, ar:'المستقبل المستمر', en:'Future Continuous'},
  {id:15, ar:'الأفعال المساعدة — to be', en:'Verb to be'},
  {id:16, ar:'to do و to have', en:'Verb to do & have'},
  {id:17, ar:'صياغة الأسئلة', en:'Question Formation'}
];

// Build sidebar
var sblist = document.getElementById('sblist');
LESSONS.forEach(function(l){
  var d = document.createElement('div');
  d.className = 'sb-item';
  d.setAttribute('data-id', l.id);
  d.innerHTML = '<div class="sb-num">'+l.id+'</div><div class="sb-name">'+l.ar+'<span class="sb-en">'+l.en+'</span></div>';
  d.addEventListener('click', function(){ loadLesson(l.id); });
  sblist.appendChild(d);
});

// Toggle sidebar
var tog = document.getElementById('tog');
var sidebar = document.getElementById('sidebar');
var mainEl = document.getElementById('main');
var open = true;

tog.addEventListener('click', function(){
  open = !open;
  if(open){
    sidebar.classList.remove('closed');
    mainEl.classList.remove('full');
    tog.classList.add('shifted');
    tog.textContent = '✕';
  } else {
    sidebar.classList.add('closed');
    mainEl.classList.add('full');
    tog.classList.remove('shifted');
    tog.textContent = '☰';
  }
});

// Initial state
sidebar.classList.remove('closed');
mainEl.classList.remove('full');
tog.classList.add('shifted');
tog.textContent = '✕';

// Load lesson
function loadLesson(id){
  document.querySelectorAll('.sb-item').forEach(function(el){
    el.classList.toggle('active', parseInt(el.getAttribute('data-id')) === id);
  });
  document.getElementById('wel').style.display = 'none';
  var lc = document.getElementById('lc');
  lc.style.display = 'block';
  var fn = CONTENT[id];
  lc.innerHTML = fn ? fn() : '<div class="blk"><p>قريباً...</p></div>';
  window.scrollTo({top:0, behavior:'smooth'});
}

// Speak
function speak(txt, el){
  if(!window.speechSynthesis){ showToast('المتصفح لا يدعم النطق'); return; }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
  window.speechSynthesis.speak(u);
  if(el){ el.classList.add('speaking'); setTimeout(function(){ el.classList.remove('speaking'); }, 600); }
  showToast('🔊 ' + txt.substring(0,35) + (txt.length>35?'...':''));
}

// Toast
var toastTimer;
function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

// Example card helper
function ec(enHtml, ar){
  var plain = enHtml.replace(/<[^>]+>/g,'');
  var safe = plain.replace(/'/g,"\\'");
  return '<div class="ecard" onclick="speak(\''+safe+'\',this)"><div class="en">'+enHtml+'</div><div class="ar">'+ar+'</div><div class="snd">🔊 اضغط للاستماع</div></div>';
}

// ============ LESSON CONTENT ============
var CONTENT = {};

CONTENT[1] = function(){
  return '<div class="lesson">'+
  '<div class="l-head"><div class="l-num">1</div><div><h2>أجزاء الكلام</h2><span class="en">Parts of Speech</span></div></div>'+

  '<div class="blk"><div class="blk-lbl tl">💡 ما هي؟</div><h3>كل كلمة إنجليزية لها وظيفة محددة!</h3><p>قبل ما تبني جملة، لازم تعرف أدوار الكلمات — اسم؟ فعل؟ صفة؟</p>'+
  '<div class="info"><span class="ic">🔑</span><p>تخيل الكلمات كلاعبين في فريق — لما تعرف دور كل لاعب تقدر تلعب أي تشكيلة!</p></div></div>'+

  '<div class="blk or"><div class="blk-lbl or">📌 الاسم — Noun</div><h3>اسم شخص أو شيء أو مكان أو حيوان</h3>'+
  '<div class="tags"><span class="tag or">Ahmed</span><span class="tag or">School</span><span class="tag or">Dog</span><span class="tag or">Flower</span></div>'+
  '<div class="grid">'+ec('The <span class="h">dog</span> is big.','الكلب كبير')+ec('<span class="h">Ahmed</span> is my friend.','أحمد صديقي')+ec('I love <span class="h">flowers</span>.','أحب الزهور')+ec('The <span class="h">school</span> is near.','المدرسة قريبة')+'</div></div>'+

  '<div class="blk"><div class="blk-lbl tl">⚡ الفعل — Verb</div><h3>يدل على حدث أو اكشن</h3>'+
  '<div class="tags"><span class="tag tl">Play</span><span class="tag tl">Study</span><span class="tag tl">Run</span><span class="tag tl">Eat</span></div>'+
  '<div class="grid">'+ec('She <span class="h">runs</span> every day.','هي تجري كل يوم')+ec('They <span class="h">play</span> football.','هم يلعبون كرة')+ec('I <span class="h">study</span> English.','أنا أدرس الإنجليزي')+'</div></div>'+

  '<div class="blk yl"><div class="blk-lbl yl">🎭 الضمير — Pronoun</div><h3>يحل محل الاسم في الجملة</h3>'+
  '<div class="tags"><span class="tag yl">I</span><span class="tag yl">He</span><span class="tag yl">She</span><span class="tag yl">They</span><span class="tag yl">We</span></div>'+
  '<div class="grid">'+ec('<span class="h">She</span> is smart.','هي ذكية')+ec('<span class="h">They</span> are happy.','هم سعداء')+ec('<span class="h">We</span> study together.','نحن ندرس سوياً')+'</div></div>'+

  '<div class="blk"><div class="blk-lbl tl">🌈 الصفة — Adjective</div><h3>تصف الاسم — تأتي قبله</h3>'+
  '<div class="info"><span class="ic">⚠️</span><p>الصفات ما تتجمع! ❌ smarts boys &nbsp;✅ smart boys</p></div>'+
  '<div class="grid">'+ec('He is a <span class="h">clever</span> boy.','هو ولد ذكي')+ec('It is a <span class="h">big</span> house.','بيت كبير')+'</div></div>'+

  '<div class="blk or"><div class="blk-lbl or">🏃 الحال — Adverb</div><h3>يظهر حالة الفعل — يأتي بعده</h3>'+
  '<div class="grid">'+ec('She runs <span class="h">fast</span>.','هي تجري بسرعة')+ec('He speaks <span class="h">quietly</span>.','يتكلم بهدوء')+'</div></div>'+

  '<div class="blk yl"><div class="blk-lbl yl">🔗 حرف الجر — Preposition</div><h3>في — إلى — من — على — بجانب...</h3>'+
  '<div class="grid">'+ec('<span class="h">In</span> England','في إنجلترا')+ec('<span class="h">At</span> 8 am','الساعة 8')+ec('<span class="h">To</span> Dubai','إلى دبي')+'</div></div>'+

  '</div>';
};

CONTENT[2] = function(){
  return '<div class="lesson">'+
  '<div class="l-head"><div class="l-num">2</div><div><h2>ضمائر الفاعل</h2><span class="en">Subject Pronouns</span></div></div>'+

  '<div class="blk"><div class="blk-lbl tl">💡 ما هي؟</div><h3>تحل محل اسم الفاعل بدل تكراره</h3>'+
  '<div class="info"><span class="ic">🌟</span><p>بدل: "Ahmed drinks milk. Ahmed is tall." نقول: "Ahmed drinks milk. <b>He</b> is tall."</p></div></div>'+

  '<div class="blk or"><div class="blk-lbl or">📋 جدول الضمائر</div>'+
  '<table class="gtbl"><tr><th>الضمير</th><th>المعنى</th><th>مثال</th></tr>'+
